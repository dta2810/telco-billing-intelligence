resources:
  jobs:
    acmetel_medallion:
      name: acmetel_medallion
      tasks:
        - task_key: setup_uc
          notebook_task:
            notebook_path: ../notebooks/00_setup_uc.py
        - task_key: generate_raw
          depends_on: [{task_key: setup_uc}]
          notebook_task:
            notebook_path: ../notebooks/01_generate_raw.py
        - task_key: bronze
          depends_on: [{task_key: generate_raw}]
          notebook_task:
            notebook_path: ../notebooks/02_bronze.py
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../notebooks/03_silver.py
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../notebooks/04_gold.py
        - task_key: metric_views
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ../notebooks/05_metric_views.py
        - task_key: validate
          depends_on: [{task_key: metric_views}]
          notebook_task:
            notebook_path: ../notebooks/06_validate.py
